{% extends 'base.html' %}



{% block title %} username {% endblock %}
{% block head %}
<!-- adding the boxicon cdn-->
<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
{% endblock %}



<!--Section for the content to be displayed  in the body section-->
{% block content %}

      <div class=" min-h-screen font-alata "><!--full height of the flex with alata font-->

       <div class="flex items-center justify-between w-full px-4 py-8   "> <!-- aligning the item of the  flex children as <cross_icon> <status bar>  <step_count>  in  cross-axis of the  page -->


             <i class="bx bx-x text-[#533B07] text-2xl px-3"></i>

            <div class="bg-[#D9D9D9] h-[15px] w-[248px] rounded-full overflow-hidden">
            <span class="block bg-[#D7B66F] h-full w-[0px] rounded-full transition-[width] duration-1800 ease-out" id="status"></span>
    
            </div>

            <span class="text-[#0A5457]">
                Step 3 of 3
            </span>
        
        </div>


       <!-- Added 'relative overflow-hidden' to keep the confetti contained -->
<div class="relative flex items-center justify-center my-20 h-[300px] overflow-hidden">
    
    <!-- Left Confetti (Positioned absolutely on the left side) -->
    <img src="{{url_for('static', filename='assets/confetti.png')}}" 
         alt="image of the confetti" 
         class="absolute left-0 top-1/2 -translate-y-1/2 w-[120px] object-contain pointer-events-none">
    
    <!-- Center Avatar (Now completely free to center perfectly) -->
    <img src="{{ url_for('static', filename='uploads/avatar_image.jpg') if method == 'avatar_upload' else url_for('static', filename='uploads/upload_avatar.jpg') }}" 
         alt="img" 
         class="rounded-full h-[220px] w-[220px] z-10 border-4 border-white shadow-sm">

    <!-- Right Confetti (Positioned absolutely on the right side) -->
    <img src="{{url_for('static', filename='assets/confetti.png')}}" 
         alt="image of the confetti" 
         class="absolute right-0 top-1/2 -translate-y-1/2 w-[120px] object-contain pointer-events-none scale-x-[-1]">
</div>

        <div  class="flex justify-center  items-center flex-col my-[-50px]">
         <h1 class="text-[26px] text-[#4D4D4C]">All Done!</h1>
         <h2 class="text-[#0A5457] opacity-70 text-[20px] py-[10px]">{{Current_user}}</h2>
        </div>

        <a {% if game_mode == 'multiplayer' %} href="{{url_for('main.multiplayer')}}" {% else %} href="{{url_for('main.krishna')}}" {% endif %}>
        <div class="flex items-center justify-center my-[132px]">
  <button class="bg-[#D7B66F] w-[314px] h-[54px] rounded-full text-3xl text-[#FFFFFF] text-center">Tic Tac Toe</button>
        </div>
        </a>
        

        </div>

        
<script>
      status_bar= document.getElementById("status");
      let  refresh_count=0; 

      document.addEventListener("DOMContentLoaded", () => {  
      statusChange();
      });

      function statusChange() {
         status_bar.style.width="248px";
      }


        </script>

{% endblock %}
